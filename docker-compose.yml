services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: fintin-clickhouse
    environment:
      # ClickHouse 26.3 requires a password for the default user. Local-only
      # dev credential; keep it in sync with [clickhouse].password in fintin.toml.
      CLICKHOUSE_PASSWORD: fintin_local
    ports:
      - "8123:8123"   # HTTP interface — clickhouse-connect default
      - "9000:9000"   # native protocol (optional)
    volumes:
      - fintin_ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  fintin_ch_data:
