[project]
name = "fin-tin"
version = "0.1.0"
description = "Local EDGAR financial-statement query tool (S&P 500 Universe, us-gaap only)"
requires-python = ">=3.12"
dependencies = [
    "typer==0.27.0",
    "clickhouse-connect==1.6.0",
]

[project.scripts]
fintin = "fintin.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fintin"]

[tool.pytest.ini_options]
markers = [
    "integration: test requires a running ClickHouse container (auto-skipped if unreachable)",
]
